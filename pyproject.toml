[project]
name = "coding-assistant"
version = "0.1.0"
description = "Local-first AI coding assistant built with LangGraph"
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "langchain>=1.3.1",
    "langchain-anthropic>=1.4.3",
    "langchain-openai>=1.2.2",
    "langgraph>=1.2.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.14",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
